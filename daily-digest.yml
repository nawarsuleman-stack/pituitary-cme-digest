name: Daily pituitary/adrenal CME digest

on:
  schedule:
    # 11:30 UTC = 7:30 AM Eastern during daylight saving (EDT, UTC-4).
    # During standard time (EST, UTC-5) this runs at 6:30 AM ET instead --
    # adjust to "30 12 * * *" in the winter if you want it to stay pinned
    # to 7:30 AM local, or just leave it; GitHub Actions cron is UTC-fixed.
    - cron: "30 11 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch candidate literature from PubMed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/fetch_pubmed.py

      - name: Build digest via Anthropic API (grounded in fetched abstracts only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_digest.py

      - name: Render static site
        run: python scripts/render_site.py

      - name: Commit and push updated site + history
        run: |
          git config user.name "cme-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ data/history.json data/latest_digest.json data/candidates.json
          git diff --quiet --cached || git commit -m "Daily digest: $(date -u +%Y-%m-%d)"
          git push
